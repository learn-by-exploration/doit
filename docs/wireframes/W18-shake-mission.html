<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W18 — Shake-N mission</title>
<meta name="viewport" content="width=412, initial-scale=1">
<style>
  :root {
    --md-bg: #13141b;
    --md-surface: #1c1d27;
    --md-surface-variant: #272834;
    --md-primary: #a8c7fa;
    --md-on-primary: #062e6f;
    --md-on-surface: #e3e3e9;
    --md-on-surface-variant: #c5c6d0;
    --md-outline: #44474f;
    --md-error: #f2b8b5;
    --md-success: #a3d977;
    --md-tertiary: #dab8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0b10; color: var(--md-on-surface); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .device { width: 412px; min-height: 892px; margin: 24px auto; background: var(--md-bg); border-radius: 36px; border: 1px solid #2a2b35; box-shadow: 0 18px 60px rgba(0,0,0,0.55); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .appbar { height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px; background: var(--md-bg); border-bottom: 1px solid var(--md-outline); }
  .icon-btn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--md-on-surface); border-radius: 24px; cursor: pointer; }
  .icon-btn:focus-visible { outline: 2px solid var(--md-primary); }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .appbar-title { font-size: 18px; font-weight: 500; margin-left: 8px; }
  .appbar-spacer { flex: 1; }
  .stepper { font-size: 14px; color: var(--md-on-surface-variant); padding-right: 16px; }
  .body { flex: 1; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .icon-hero { width: 200px; height: 200px; border-radius: 100px; background: radial-gradient(circle at 50% 40%, var(--md-primary) 0%, rgba(168,199,250,0.18) 60%, rgba(168,199,250,0.05) 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 60px rgba(168,199,250,0.25); }
  .icon-hero svg { width: 96px; height: 96px; fill: var(--md-on-primary); }
  .headline { font-size: 24px; font-weight: 600; text-align: center; line-height: 1.3; }
  .subtitle { font-size: 16px; color: var(--md-on-surface-variant); text-align: center; }
  .counter { font-variant-numeric: tabular-nums; font-size: 56px; font-weight: 700; letter-spacing: -0.5px; }
  .counter span.faded { color: var(--md-on-surface-variant); font-weight: 400; font-size: 32px; }
  .progress-row { width: 100%; display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .pip { width: 18px; height: 18px; border-radius: 9px; background: var(--md-surface-variant); border: 1px solid var(--md-outline); }
  .pip.done { background: var(--md-success); border-color: var(--md-success); }
  .pip.current { background: var(--md-primary); border-color: var(--md-primary); box-shadow: 0 0 12px rgba(168,199,250,0.6); }
  .sensor-hint { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 12px; background: var(--md-surface); border: 1px solid var(--md-outline); font-size: 14px; color: var(--md-on-surface-variant); }
  .sensor-hint .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--md-success); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .cancel { margin-top: auto; padding: 12px 24px; background: transparent; color: var(--md-on-surface-variant); border: 1px solid var(--md-outline); border-radius: 24px; font-size: 14px; min-height: 48px; }
  .watermark { position: absolute; bottom: 12px; right: 16px; font-size: 11px; color: var(--md-on-surface-variant); opacity: 0.55; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="device" role="application" aria-label="Shake-N mission screen">
  <header class="appbar" role="banner">
    <button class="icon-btn" aria-label="Cancel mission">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div class="appbar-title">Mission</div>
    <div class="appbar-spacer"></div>
    <div class="stepper" aria-label="Mission progress">1 of 3</div>
  </header>

  <main class="body" role="main">
    <div class="icon-hero" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v4l3-3 1.4 1.4-2.8 2.8c.9 1 1.4 2.3 1.4 3.8 0 .9-.2 1.7-.5 2.5l1.9 7.5c.2.8-.4 1.6-1.2 1.6h-2.4c-.6 0-1.1-.4-1.3-1l-1.5-6h-1l-1.5 6c-.2.6-.7 1-1.3 1H6c-.8 0-1.4-.8-1.2-1.6l1.9-7.5c-.3-.8-.5-1.6-.5-2.5 0-1.5.5-2.8 1.4-3.8L5 6.4 6.4 5l3 3V4a2 2 0 0 1 2-2z"/></svg>
    </div>

    <h1 class="headline">Shake the phone 10 times</h1>

    <div class="counter" aria-live="polite" aria-atomic="true">
      <span>3</span><span class="faded"> / 10</span>
    </div>

    <div class="progress-row" aria-hidden="true">
      <span class="pip done"></span>
      <span class="pip done"></span>
      <span class="pip done"></span>
      <span class="pip current"></span>
      <span class="pip"></span>
      <span class="pip"></span>
      <span class="pip"></span>
      <span class="pip"></span>
      <span class="pip"></span>
      <span class="pip"></span>
    </div>

    <p class="subtitle" id="hint">3 of 10 detected</p>

    <div class="sensor-hint" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span>Accelerometer active · keep shaking</span>
    </div>

    <button class="cancel" type="button">Cancel mission</button>
  </main>

  <span class="watermark">W-18 · Group D</span>
</div>
</body>
</html>
